modules:
  jira:issuePanel:
    - key: stakes-issue-panel
      title: Stakes
      icon: resource:icons;stakes.svg
      resource: panel
      render: native
      resolver:
        function: resolver
  rovo:agent:
    - key: stakes-analyst
      name: Stakes Analyst
      description: Explains what is riding on Jira work and who to tell when it ships.
      prompt: resource:agent-prompt;agent.md
      conversationStarters:
        - What is riding on PAY-142?
      actions:
        - get-issue-stakes
  action:
    - key: get-issue-stakes
      name: Get issue stakes
      function: getIssueStakes
      actionVerb: GET
      description: >
        Returns what is riding on one Jira issue (its Stakes Score, evidence and
        suggested priority) with links to every source. Use it whenever the user asks
        about a specific issue key.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira issue key, for example PAY-142.
  rovo:mcp:
    - key: stakes-mcp
      name: Stakes
      tools:
        - get-issue-stakes
  llm:
    - key: stakes-llm
      model:
        - claude
  function:
    - key: resolver
      handler: resolvers/index.handler
    - key: getIssueStakes
      handler: actions/index.getIssueStakes
resources:
  - key: panel
    path: src/frontend/panel.tsx
  - key: icons
    path: static/icons
  - key: agent-prompt
    path: prompts
permissions:
  scopes:
    - read:jira-work
app:
  runtime:
    name: nodejs22.x
  # One app id serves both products. Jira holds the data and is required; Confluence
  # only adds the weekly digest and the macro, so sites without it still work.
  compatibility:
    jira:
      required: true
    confluence:
      required: false
  # Replaced by `forge register`; the all-zero id only lets the manifest lint before then.
  id: ari:cloud:ecosystem::app/00000000-0000-0000-0000-000000000000
