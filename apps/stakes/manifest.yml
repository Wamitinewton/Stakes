modules:
  jira:customField:
    - key: stakes-score-field
      name: Stakes Score
      type: number
      readOnly: true
  jira:issuePanel:
    - key: stakes-issue-panel
      title: Stakes
      icon: resource:icons;stakes.svg
      resource: panel
      render: native
      resolver:
        function: resolver
  jira:adminPage:
    - key: stakes-settings
      title: Stakes settings
      icon: resource:icons;stakes.svg
      resource: settings
      render: native
      resolver:
        function: resolver
  graph:connector:
    - key: stakes-crm
      name: Stakes CRM
      icons:
        light: resource:icons;stakes.svg
        dark: resource:icons;stakes.svg
      objectTypes:
        - atlassian:customer-org
        - atlassian:deal
      capabilities:
        replicatesPermissions: false
        syncFidelity: upsert
        supportsIncrementalSync: false
      datasource:
        onConnectionChange:
          function: onConnectionChange
  rovo:agent:
    - key: stakes-analyst
      name: Stakes Analyst
      description: Explains what is riding on Jira work and who to tell when it ships.
      prompt: resource:agent-prompt;agent.md
      conversationStarters:
        - What is riding on PAY-142?
      actions:
        - get-issue-stakes
  action:
    - key: get-issue-stakes
      name: Get issue stakes
      function: getIssueStakes
      actionVerb: GET
      description: >
        Returns what is riding on one Jira issue (its Stakes Score, evidence and
        suggested priority) with links to every source. Use it whenever the user asks
        about a specific issue key.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira issue key, for example PAY-142.
  rovo:mcp:
    - key: stakes-mcp
      name: Stakes
      tools:
        - get-issue-stakes
  llm:
    - key: stakes-llm
      model:
        - claude
  function:
    - key: resolver
      handler: resolvers/index.handler
    - key: getIssueStakes
      handler: actions/index.getIssueStakes
    - key: onConnectionChange
      handler: triggers/index.onConnectionChange
resources:
  - key: panel
    path: src/frontend/panel.tsx
  - key: settings
    path: src/frontend/settings.tsx
  - key: icons
    path: static/icons
  - key: agent-prompt
    path: prompts
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    # Creating and deleting the demo fix version.
    - manage:jira-project
    - read:board-scope:jira-software
    - read:sprint:jira-software
    - write:sprint:jira-software
    - read:servicedesk-request
    - write:servicedesk-request
    - storage:app
    - write:object:jira
    - read:object:jira
    - delete:object:jira
    - read:graph:issue:jira
app:
  storage:
    entities:
      - name: customer
        attributes:
          id: { type: string }
          name: { type: string }
          tier: { type: string }
          arrUsd: { type: float }
          renewalDate: { type: string }
          ownerAccountId: { type: string }
          source: { type: string }
        indexes:
          - name: by-owner
            range: ownerAccountId
          - name: by-renewal
            range: renewalDate
          - name: by-name
            range: name
          - name: by-source
            partition: [source]
            range: id
      - name: deal
        attributes:
          id: { type: string }
          customerId: { type: string }
          name: { type: string }
          amountUsd: { type: float }
          stage: { type: string }
          probability: { type: float }
          closeDate: { type: string }
          closed: { type: boolean }
          ownerAccountId: { type: string }
          # Kept on the deal for display; queries go through deal_issue, because an
          # index can only cover scalar attributes.
          issueKeys: { type: any }
          source: { type: string }
        indexes:
          - name: by-customer
            partition: [customerId]
            range: id
          - name: by-owner
            range: ownerAccountId
          - name: by-close-date
            range: closeDate
          - name: by-source
            partition: [source]
            range: id
      - name: deal_issue
        attributes:
          issueKey: { type: string }
          refId: { type: string }
          source: { type: string }
        indexes:
          - name: by-issue
            partition: [issueKey]
            range: refId
          - name: by-ref
            partition: [refId]
            range: issueKey
          - name: by-source
            partition: [source]
            range: issueKey
      - name: customer_issue
        attributes:
          issueKey: { type: string }
          refId: { type: string }
          source: { type: string }
        indexes:
          - name: by-issue
            partition: [issueKey]
            range: refId
          - name: by-ref
            partition: [refId]
            range: issueKey
          - name: by-source
            partition: [source]
            range: issueKey
      - name: message
        attributes:
          id: { type: string }
          issueKey: { type: string }
          channel: { type: string }
          author: { type: string }
          text: { type: string }
          at: { type: string }
          url: { type: string }
          source: { type: string }
        indexes:
          - name: by-issue
            partition: [issueKey]
            range: at
          - name: by-source
            partition: [source]
            range: id
      - name: snapshot
        attributes:
          issueKey: { type: string }
          projectKey: { type: string }
          score: { type: integer }
          confidence: { type: string }
          raw: { type: any }
          normalised: { type: any }
          contributions: { type: any }
          evidence: { type: any }
          currentPriority: { type: string }
          suggestedPriority: { type: string }
          badges: { type: any }
          weightsUsed: { type: any }
          weightsVersion: { type: integer }
          dealsVersion: { type: integer }
          evidenceHash: { type: string }
          summary: { type: any }
          degraded: { type: any }
          hiddenItems: { type: integer }
          computedAt: { type: string }
        indexes:
          - name: by-project-score
            partition: [projectKey]
            range: score
      - name: history
        attributes:
          issueKey: { type: string }
          projectKey: { type: string }
          day: { type: string }
          score: { type: integer }
          badges: { type: any }
          source: { type: string }
        indexes:
          - name: by-issue-day
            partition: [issueKey]
            range: day
          - name: by-project-day
            partition: [projectKey]
            range: day
          - name: by-source
            partition: [source]
            range: day
      - name: audit
        attributes:
          id: { type: string }
          issueKey: { type: string }
          kind: { type: string }
          from: { type: string }
          to: { type: string }
          score: { type: integer }
          topEvidence: { type: any }
          actorAccountId: { type: string }
          at: { type: string }
        indexes:
          - name: by-issue
            partition: [issueKey]
            range: at
          - name: by-at
            range: at
      - name: ship_notice
        attributes:
          issueKey: { type: string }
          trigger: { type: string }
          recipients: { type: any }
          jsmRequests: { type: any }
          internalDraft: { type: string }
          customerDraft: { type: string }
          status: { type: string }
          createdAt: { type: string }
          sentBy: { type: string }
        indexes:
          - name: by-status
            partition: [status]
            range: createdAt
          - name: by-issue
            partition: [issueKey]
            range: createdAt
  runtime:
    name: nodejs22.x
  # One app id serves both products. Jira holds the data and is required; Confluence
  # only adds the weekly digest and the macro, so sites without it still work.
  compatibility:
    jira:
      required: true
    confluence:
      required: false
  # Replaced by `forge register`; the all-zero id only lets the manifest lint before then.
  id: ari:cloud:ecosystem::app/00000000-0000-0000-0000-000000000000
