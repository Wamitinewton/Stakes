modules:
  jira:issuePanel:
    - key: stakes-issue-panel
      title: Stakes
      icon: resource:icons;stakes.svg
      resource: panel
      render: native
      resolver:
        function: resolver
  llm:
    - key: stakes-llm
      model:
        - claude
  function:
    - key: resolver
      handler: resolvers/index.handler
resources:
  - key: panel
    path: src/frontend/panel.tsx
  - key: icons
    path: static/icons
permissions:
  scopes:
    - read:jira-work
app:
  runtime:
    name: nodejs22.x
  # One app id serves both products. Jira holds the data and is required; Confluence
  # only adds the weekly digest and the macro, so sites without it still work.
  compatibility:
    jira:
      required: true
    confluence:
      required: false
  # Replaced by `forge register`; the all-zero id only lets the manifest lint before then.
  id: ari:cloud:ecosystem::app/00000000-0000-0000-0000-000000000000
