modules:
  jira:customField:
    - key: stakes-score-field
      name: Stakes Score
      description: How much customer, revenue, support and goal evidence rides on the issue, from 0 to 100.
      type: number
      readOnly: true
  jira:issuePanel:
    - key: stakes-issue-panel
      title: Stakes
      icon: resource:icons;stakes.svg
      resource: panel
      render: native
      resolver:
        function: resolver
  jira:issueContext:
    - key: stakes-issue-context
      title: Stakes
      label: Stakes
      resource: badge
      render: native
      resolver:
        function: resolver
  jira:adminPage:
    - key: stakes-settings
      title: Stakes settings
      icon: resource:icons;stakes.svg
      resource: settings
      render: native
      resolver:
        function: resolver
  jira:projectPage:
    - key: stakes-backlog
      title: Stakes
      icon: resource:icons;stakes.svg
      resource: backlog-ui
      resolver:
        function: resolver
  macro:
    - key: stakes-macro
      title: Stakes
      resource: macro
      render: native
      resolver:
        function: resolver
      config:
        openOnInsert: true
  graph:connector:
    - key: stakes-crm
      name: Stakes CRM
      icons:
        light: resource:icons;stakes.svg
        dark: resource:icons;stakes.svg
      objectTypes:
        - atlassian:customer-org
        - atlassian:deal
      capabilities:
        replicatesPermissions: false
        syncFidelity: upsert
        supportsIncrementalSync: false
      datasource:
        onConnectionChange:
          function: onConnectionChange
  rovo:agent:
    - key: stakes-analyst
      name: Stakes Analyst
      description: >
        Explains what is riding on Jira work (customers, deal value, support
        pressure and goals) and drafts updates for the people waiting when it
        ships.
      prompt: resource:agent-prompt;agent.md
      conversationStarters:
        - What should we fix first in PAY?
        - What is Kilima Freight waiting on?
        - What revenue does release 2026.12 unblock?
        - Draft an update for customers waiting on PAY-142.
      actions:
        - get-issue-stakes
        - rank-backlog
        - find-customer-exposure
        - get-release-stakes
        - draft-customer-update
        - get-score-trend
        - suggest-sprint-scope
  action:
    - key: get-issue-stakes
      name: Get issue stakes
      function: getIssueStakes
      actionVerb: GET
      description: >-
        Returns what rides on one Jira issue: Stakes Score, priority, badges, customers and deal values waiting with owners, status, assignee, target versions and top evidence with links. Use when the user names an issue key such as PAY-142.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira issue key, for example PAY-142.
    - key: rank-backlog
      name: Rank backlog by stakes
      function: rankBacklog
      actionVerb: GET
      description: >-
        Ranks a project's open issues by Stakes Score with priority, badges, revenue at risk and customers. Use for "what should we fix first"; filter silent-fires finds high stakes at low priority, phantoms finds high priority with no evidence.
      inputs:
        projectKey:
          title: Project key
          type: string
          required: true
          description: The Jira project key, for example PAY.
        limit:
          title: Limit
          type: integer
          required: false
          description: How many issues to return, 1 to 25. Defaults to 10.
        filter:
          title: Filter
          type: string
          required: false
          description: One of all, silent-fires or phantoms. Defaults to all.
    - key: find-customer-exposure
      name: Find customer exposure
      function: findCustomerExposure
      actionVerb: GET
      description: >-
        Returns what one customer is waiting on: open issues with status, assignee, target versions and score, plus deal value at risk, renewal date and account owner. If several customers match, returns the matches so you can ask which one.
      inputs:
        customer:
          title: Customer
          type: string
          required: true
          description: The customer's name, for example Kilima Freight, or its id such as
            CUST-007.
    - key: get-release-stakes
      name: Get release stakes
      function: getReleaseStakes
      actionVerb: GET
      description: >-
        Returns what an unreleased version unblocks: revenue of open deals waiting on its issues, the customers it serves and its issues ranked by score. Use for "What revenue does release 2026.12 unblock?". The project is optional.
      inputs:
        version:
          title: Version
          type: string
          required: true
          description: The version name, for example 2026.12.
        projectKey:
          title: Project key
          type: string
          required: false
          description: The Jira project key, if the user named one.
    - key: draft-customer-update
      name: Draft customer update
      function: draftCustomerUpdate
      actionVerb: GET
      description: >-
        Drafts a short message telling customers an issue's fix has shipped. Without a customer it names no company; with one it addresses only that customer. Never includes deal values, scores or priorities, and sends nothing.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira issue key whose fix shipped, for example PAY-142.
        customer:
          title: Customer
          type: string
          required: false
          description: A customer linked to the issue, by name or id. Leave empty for a
            general update.
        tone:
          title: Tone
          type: string
          required: false
          description: brief (two or three sentences) or detailed. Defaults to brief.
    - key: get-score-trend
      name: Get score trend
      function: getScoreTrend
      actionVerb: GET
      description: >-
        Returns how Stakes Scores moved over the last 30 days: one issue's daily scores, or the biggest movers and stakes jumps in a project. Use for "has PAY-118 become more urgent?" or "what jumped this week in PAY?".
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: false
          description: An issue key, for example PAY-118. Give this or a project key.
        projectKey:
          title: Project key
          type: string
          required: false
          description: A project key, for example PAY. Give this or an issue key.
    - key: suggest-sprint-scope
      name: Suggest sprint scope
      function: suggestSprintScope
      actionVerb: GET
      description: >-
        Proposes open, unassigned issues for a future sprint that cover the most stakes within its story-point capacity, with issues already in it, unestimated keys, score and revenue totals and links. Applying needs confirmation in the Stakes UI.
      inputs:
        projectKey:
          title: Project key
          type: string
          required: true
          description: The Jira project key, for example PAY.
        sprint:
          title: Sprint
          type: string
          required: true
          description: The sprint name, for example PAY Sprint 24.
        capacity:
          title: Capacity
          type: number
          required: false
          description: Story points available in the sprint.
  rovo:mcp:
    # The same read-only handlers as the agent's actions, for external assistants. Off
    # until a site admin enables external access for the installation.
    - key: stakes-mcp
      name: Stakes
      tools:
        - get-issue-stakes
        - rank-backlog
        - find-customer-exposure
        - get-release-stakes
        - draft-customer-update
        - get-score-trend
        - suggest-sprint-scope
  llm:
    - key: stakes-llm
      model:
        - claude
  jira:entityProperty:
    # Indexed so the bridge app can find sent, undelivered notices with JQL:
    # issue.property[stakes.shipNotice].status = sent, or stakesShipNoticeStatus = sent.
    - key: stakes-ship-property
      entityType: issue
      propertyKey: stakes.shipNotice
      values:
        - path: status
          type: string
          searchAlias: stakesShipNoticeStatus
        - path: deliveredAt
          type: date
          searchAlias: stakesShipNoticeDeliveredAt
  trigger:
    # Both run as the app. They only read Jira and storage and save a pending notice;
    # everything people see is posted later by whoever clicks Send.
    - key: on-issue-updated
      function: onIssueUpdated
      events:
        - avi:jira:updated:issue
      filter:
        ignoreSelf: true
    - key: on-version-released
      function: onVersionReleased
      events:
        - avi:jira:released:version
  scheduledTrigger:
    - key: nightly-maintenance
      function: nightly
      interval: day
    # Daily is the portable schedule; the handler exits until Monday at 06:00 UTC.
    - key: weekly-digest
      function: digest
      interval: day
  function:
    - key: resolver
      handler: resolvers/index.handler
    - key: getIssueStakes
      handler: actions/index.getIssueStakes
    - key: rankBacklog
      handler: actions/index.rankBacklog
    - key: findCustomerExposure
      handler: actions/index.findCustomerExposure
    - key: getReleaseStakes
      handler: actions/index.getReleaseStakes
    - key: draftCustomerUpdate
      handler: actions/index.draftCustomerUpdate
    - key: getScoreTrend
      handler: actions/index.getScoreTrend
    - key: suggestSprintScope
      handler: actions/index.suggestSprintScope
    - key: onConnectionChange
      handler: triggers/index.onConnectionChange
    - key: nightly
      handler: triggers/index.nightly
    - key: digest
      handler: triggers/index.weeklyDigest
    - key: onIssueUpdated
      handler: triggers/index.onIssueUpdated
    - key: onVersionReleased
      handler: triggers/index.onVersionReleased
resources:
  - key: panel
    path: src/frontend/panel.tsx
  - key: badge
    path: src/frontend/badge.tsx
  - key: settings
    path: src/frontend/settings.tsx
  - key: backlog-ui
    path: static/backlog/dist
  - key: macro
    path: src/frontend/macro.tsx
  - key: icons
    path: static/icons
  - key: agent-prompt
    path: prompts
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    # Creating and deleting the demo fix version.
    - manage:jira-project
    - read:board-scope:jira-software
    - read:sprint:jira-software
    - write:sprint:jira-software
    - read:servicedesk-request
    - write:servicedesk-request
    - read:confluence-content.summary
    - write:confluence-content
    - storage:app
    - write:object:jira
    - read:object:jira
    - delete:object:jira
    - read:graph:issue:jira
app:
  storage:
    entities:
      - name: customer
        attributes:
          id:
            type: string
          name:
            type: string
          tier:
            type: string
          arrUsd:
            type: float
          renewalDate:
            type: string
          ownerAccountId:
            type: string
          source:
            type: string
        indexes:
          - name: by-owner
            range: [ownerAccountId]
          - name: by-renewal
            range: [renewalDate]
          - name: by-name
            range: [name]
          - name: by-source
            partition: [source]
            range: [id]
      - name: deal
        attributes:
          id:
            type: string
          customerId:
            type: string
          name:
            type: string
          amountUsd:
            type: float
          stage:
            type: string
          probability:
            type: float
          closeDate:
            type: string
          closed:
            type: boolean
          ownerAccountId:
            type: string
          issueKeys:
            type: any
          source:
            type: string
        indexes:
          - name: by-customer
            partition: [customerId]
            range: [id]
          - name: by-owner
            range: [ownerAccountId]
          - name: by-close-date
            range: [closeDate]
          - name: by-source
            partition: [source]
            range: [id]
      - name: deal_issue
        attributes:
          issueKey:
            type: string
          refId:
            type: string
          source:
            type: string
        indexes:
          - name: by-issue
            partition: [issueKey]
            range: [refId]
          - name: by-ref
            partition: [refId]
            range: [issueKey]
          - name: by-source
            partition: [source]
            range: [issueKey]
      - name: customer_issue
        attributes:
          issueKey:
            type: string
          refId:
            type: string
          source:
            type: string
        indexes:
          - name: by-issue
            partition: [issueKey]
            range: [refId]
          - name: by-ref
            partition: [refId]
            range: [issueKey]
          - name: by-source
            partition: [source]
            range: [issueKey]
      - name: message
        attributes:
          id:
            type: string
          issueKey:
            type: string
          channel:
            type: string
          author:
            type: string
          text:
            type: string
          at:
            type: string
          url:
            type: string
          source:
            type: string
        indexes:
          - name: by-issue
            partition: [issueKey]
            range: [at]
          - name: by-source
            partition: [source]
            range: [id]
      - name: snapshot
        attributes:
          issueKey:
            type: string
          projectKey:
            type: string
          score:
            type: integer
          confidence:
            type: string
          raw:
            type: any
          normalised:
            type: any
          contributions:
            type: any
          evidence:
            type: any
          currentPriority:
            type: string
          suggestedPriority:
            type: string
          badges:
            type: any
          weightsUsed:
            type: any
          weightsVersion:
            type: integer
          dealsVersion:
            type: integer
          evidenceHash:
            type: string
          summary:
            type: any
          degraded:
            type: any
          hiddenItems:
            type: integer
          computedAt:
            type: string
        indexes:
          - name: by-project-score
            partition: [projectKey]
            range: [score]
      - name: history
        attributes:
          issueKey:
            type: string
          projectKey:
            type: string
          day:
            type: string
          score:
            type: integer
          badges:
            type: any
          source:
            type: string
        indexes:
          - name: by-issue-day
            partition: [issueKey]
            range: [day]
          - name: by-project-day
            partition: [projectKey]
            range: [day]
          - name: by-day
            range: [day]
          - name: by-source
            partition: [source]
            range: [day]
      - name: audit
        attributes:
          id:
            type: string
          issueKey:
            type: string
          kind:
            type: string
          from:
            type: string
          to:
            type: string
          score:
            type: integer
          topEvidence:
            type: any
          actorAccountId:
            type: string
          at:
            type: string
        indexes:
          - name: by-issue
            partition: [issueKey]
            range: [at]
          - name: by-at
            range: [at]
      - name: ship_notice
        attributes:
          id:
            type: string
          issueKey:
            type: string
          trigger:
            type: string
          versionId:
            type: string
          versionName:
            type: string
          recipients:
            type: any
          jsmRequests:
            type: any
          customers:
            type: any
          internalDraft:
            type: string
          internalGenerated:
            type: boolean
          citedIds:
            type: any
          status:
            type: string
          createdAt:
            type: string
          updatedAt:
            type: string
          sentBy:
            type: string
          sentAt:
            type: string
          dismissedBy:
            type: string
        indexes:
          - name: by-status
            partition: [status]
            range: [createdAt]
          - name: by-issue
            partition: [issueKey]
            range: [createdAt]
          - name: by-sent-at
            partition: [status]
            range: [sentAt]
      - name: llm_cache
        attributes:
          text:
            type: string
          citedIds:
            type: any
          createdAt:
            type: string
          usedAt:
            type: string
        indexes:
          - name: by-used
            range: [usedAt]
  runtime:
    name: nodejs22.x
  compatibility:
    jira:
      required: true
    confluence:
      required: false
  id: ari:cloud:ecosystem::app/f756c1f8-9daa-4487-8fd6-b441969bae13
