modules:
  jira:adminPage:
    - key: bridge-settings
      title: Stakes bridge settings
      icon: resource:icons;bridge.svg
      resource: settings
      render: native
      resolver:
        function: resolver
  graph:connector:
    - key: bridge-crm
      name: Stakes bridge CRM
      icons:
        light: resource:icons;bridge.svg
        dark: resource:icons;bridge.svg
      objectTypes:
        - atlassian:customer-org
        - atlassian:deal
      capabilities:
        replicatesPermissions: false
        syncFidelity: upsert
        supportsIncrementalSync: false
      datasource:
        onConnectionChange:
          function: onConnectionChange
  scheduledTrigger:
    - key: crm-sync
      function: crmSync
      interval: hour
    - key: deliver
      function: deliver
      interval: fiveMinute
  function:
    - key: resolver
      handler: resolvers/index.handler
    - key: crmSync
      handler: triggers/index.crmSync
    - key: deliver
      handler: triggers/index.deliver
    - key: onConnectionChange
      handler: triggers/index.onConnectionChange
resources:
  - key: settings
    path: src/frontend/settings.tsx
  - key: icons
    path: static/icons
permissions:
  external:
    fetch:
      backend:
        - api.hubapi.com
        - slack.com
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - read:object:jira
    - write:object:jira
    - delete:object:jira
    - storage:app
app:
  runtime:
    name: nodejs22.x
  # Replaced by `forge register`; the all-zero id only lets the manifest lint before then.
  id: ari:cloud:ecosystem::app/00000000-0000-0000-0000-000000000000
