name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - name: stakes declares no egress
        run: |
          if [ -f apps/stakes/manifest.yml ]; then
            node apps/stakes/scripts/check-egress.mjs
          else
            echo "::notice::apps/stakes has no manifest yet; skipping the egress check"
          fi

  forge:
    name: Forge lint and eligibility
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check Forge credentials
        id: creds
        run: |
          # Fork pull requests get no secrets. The CLI still validates the manifest
          # before reporting that login is unavailable; only that exact login failure
          # is skippable. Validation errors must fail the job.
          if [ -n "$FORGE_API_TOKEN" ] && [ -n "$FORGE_EMAIL" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::FORGE_EMAIL and FORGE_API_TOKEN are not set; authenticated Forge checks will be skipped after manifest validation"
          fi
      - name: Install Forge CLI
        run: |
          npm install --global @forge/cli
          forge settings set usage-analytics false
      - name: forge lint and manifest validation
        run: |
          for app in apps/stakes apps/stakes-bridge; do
            if [ ! -f "$app/manifest.yml" ]; then
              echo "::notice::$app has no manifest yet; skipping forge lint"
              continue
            fi
            echo "::group::forge lint $app"
            set +e
            output=$(cd "$app" && forge lint 2>&1)
            status=$?
            set -e
            printf '%s\n' "$output"
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              case "$output" in
                *"Error: Not logged in."*)
                  echo "::notice::$app passed local manifest validation; authenticated lint requires Forge credentials"
                  ;;
                *)
                  exit "$status"
                  ;;
              esac
            fi
          done
      - name: forge eligibility (stakes)
        if: steps.creds.outputs.available == 'true'
        run: |
          if [ ! -f apps/stakes/manifest.yml ]; then
            echo "::notice::apps/stakes has no manifest yet; skipping forge eligibility"
            exit 0
          fi
          cd apps/stakes && forge eligibility --verbose

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

