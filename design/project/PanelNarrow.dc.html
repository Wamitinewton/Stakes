<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stakes panel, 400 px dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 480px; min-height: 2100px; background: #18191A; font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; color: #CECFD2;">
  <dc-import name="Main" dark="{{ true }}" panel-width="400" chrome="{{ false }}" start-view="default" hint-size="480px,2100px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":2100}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
